name: Benchmarks

# Pull requests: typecheck + HttpService regression check.
# Full Docker/k6 benchmark: called by the Release workflow after a version is
# published (once per release), or run manually.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:
    inputs:
      node_versions:
        description: 'Node.js versions for the full benchmark (comma-separated)'
        required: false
        default: '22,24,26'
        type: string
  workflow_call:
    inputs:
      node_versions:
        description: 'Node.js versions for the full benchmark (comma-separated)'
        required: false
        default: '22,24,26'
        type: string

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck benchmark apps (Node ${{ matrix.node-version }})
    # Pull requests and manual runs; a release already passed the PR checks
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build and pack the library
        run: ./benchmarks/scripts/pack-lib.sh
      - name: Install benchmark dependencies
        working-directory: benchmarks
        run: npm ci && npm run install-lib
      - name: Typecheck
        working-directory: benchmarks
        run: npm run typecheck

  regression:
    name: HttpService regression check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build head
        run: npm ci --ignore-scripts && npm run build
      - name: Build base (${{ github.event.pull_request.base.ref }})
        run: |
          git worktree add ../base ${{ github.event.pull_request.base.sha }}
          cd ../base && npm ci --ignore-scripts && npm run build
      - name: Compare client CPU time per request
        # compare.js writes its own summary table to $GITHUB_STEP_SUMMARY. On a regression it
        # retries once (fresh rounds) before failing, so a single unlucky round doesn't fail the PR.
        run: |
          node benchmarks/micro/compare.js --base ../base --head . \
            --rounds 5 --duration 2 --threshold 10

  ab_check:
    name: End-to-end A/B check (no Docker, no k6)
    # PRs and releases (this workflow is called by Release once a version is published).
    # Informational only: continue-on-error keeps it from ever failing the run.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and pack the library
        run: ./benchmarks/scripts/pack-lib.sh
      - name: Install benchmark dependencies
        working-directory: benchmarks
        run: npm ci && npm run install-lib
      - name: Run the A/B check
        # Writes its own markdown summary to $GITHUB_STEP_SUMMARY.
        working-directory: benchmarks
        run: npm run bench:ab

  full:
    name: Full benchmark (Node ${{ matrix.node-version }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(format('[{0}]', inputs.node_versions || '22,24,26')) }}
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and pack the library
        run: ./scripts/pack-lib.sh
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - name: Start services
        run: |
          COMPOSE_FILE=docker-compose-node${{ matrix.node-version }}.yml
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          docker compose -f $COMPOSE_FILE up -d --build
      - name: Wait for services
        run: |
          case "${{ matrix.node-version }}" in 22) BASE=3010;; 24) BASE=3020;; 26) BASE=3030;; esac
          for OFFSET in 1 2 3 4 5 6 7 8; do
            URL="http://localhost:$((BASE + OFFSET))/api"; [ $OFFSET = 1 ] && URL="$URL/data"
            for i in $(seq 1 90); do curl -sf "$URL" > /dev/null && break; sleep 2; done
            if ! curl -sf "$URL" > /dev/null; then
              echo "::error::$URL did not become ready"
              docker compose -f $COMPOSE_FILE ps
              docker compose -f $COMPOSE_FILE logs --tail=50
              exit 1
            fi
            echo "$URL ready"
          done
      - name: Run k6
        run: |
          k6 run \
            -e BENCHMARK_ENVIRONMENT="GitHub Actions ubuntu-latest runner, Docker Compose (one container per app), k6 on the same runner" \
            -e LIBRARY_REF="nestjs-axios-undici@$(node -p "require('../package.json').version") (${GITHUB_SHA::7})" \
            k6-scripts/test-node${{ matrix.node-version }}.js
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-node${{ matrix.node-version }}
          path: |
            benchmarks/results/node${{ matrix.node-version }}-performance-comparison.csv
            benchmarks/results/node${{ matrix.node-version }}-performance-summary.json
          retention-days: 30
      - name: Stop services
        if: always()
        run: docker compose -f $COMPOSE_FILE down

  publish:
    name: Publish results
    # Runs only when every Node.js version produced results.
    needs: full
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-node*
          path: artifacts
          merge-multiple: true
      - name: Generate the docs page and both README headlines
        working-directory: benchmarks
        run: |
          cp ../artifacts/* results/
          node generate-comparison-report.js --docs ../docs/benchmarks.md
          node generate-comparison-report.js --headline ../README.md
          node generate-comparison-report.js --headline README.md
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results benchmarks/README.md docs/benchmarks.md README.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore(benchmarks): update results [skip ci]" -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git pull --rebase origin main
          git push origin HEAD:main
