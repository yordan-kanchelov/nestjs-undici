# One app image (apps/nestjs-app), 6 services that only differ by CLIENT /
# PLATFORM / INTERCEPTOR, plus the mock backend and the raw-undici floor.
# Ports are $(portBase)+offset; see k6-scripts/lib/benchmark.js SERVICES.
x-nestjs-app: &nestjs-app
  build:
    context: .
    dockerfile: apps/nestjs-app/Dockerfile
    args:
      NODE_VERSION: 22
  depends_on:
    - mock-service-node22
  networks:
    - nestjs-benchmark-node22

services:
  mock-service-node22:
    build:
      context: .
      dockerfile: apps/mock-service/Dockerfile
      args:
        NODE_VERSION: 22
    ports:
      - "3011:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
    networks:
      - nestjs-benchmark-node22

  express-axios-node22:
    <<: *nestjs-app
    ports:
      - "3012:3002"
    environment:
      - PORT=3002
      - CLIENT=axios
      - PLATFORM=express
      - MOCK_SERVICE_URL=http://mock-service-node22:3001/api/data

  express-undici-node22:
    <<: *nestjs-app
    ports:
      - "3013:3003"
    environment:
      - PORT=3003
      - CLIENT=undici
      - PLATFORM=express
      - MOCK_SERVICE_URL=http://mock-service-node22:3001/api/data

  fastify-axios-node22:
    <<: *nestjs-app
    ports:
      - "3014:3004"
    environment:
      - PORT=3004
      - CLIENT=axios
      - PLATFORM=fastify
      - MOCK_SERVICE_URL=http://mock-service-node22:3001/api/data

  fastify-undici-node22:
    <<: *nestjs-app
    ports:
      - "3015:3005"
    environment:
      - PORT=3005
      - CLIENT=undici
      - PLATFORM=fastify
      - MOCK_SERVICE_URL=http://mock-service-node22:3001/api/data

  express-axios-interceptor-node22:
    <<: *nestjs-app
    ports:
      - "3016:3006"
    environment:
      - PORT=3006
      - CLIENT=axios
      - PLATFORM=express
      - INTERCEPTOR=1
      - MOCK_SERVICE_URL=http://mock-service-node22:3001/api/data

  express-undici-interceptor-node22:
    <<: *nestjs-app
    ports:
      - "3017:3007"
    environment:
      - PORT=3007
      - CLIENT=undici
      - PLATFORM=express
      - INTERCEPTOR=1
      - MOCK_SERVICE_URL=http://mock-service-node22:3001/api/data

  undici-raw-node22:
    build:
      context: .
      dockerfile: apps/undici-raw/Dockerfile
      args:
        NODE_VERSION: 22
    ports:
      - "3018:3008"
    environment:
      - PORT=3008
      - MOCK_SERVICE_URL=http://mock-service-node22:3001/api/data
    depends_on:
      - mock-service-node22
    networks:
      - nestjs-benchmark-node22

networks:
  nestjs-benchmark-node22:
    driver: bridge
