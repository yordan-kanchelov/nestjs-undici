# One app image (apps/nestjs-app), 6 services that only differ by CLIENT /
# PLATFORM / INTERCEPTOR, plus the mock backend and the raw-undici floor.
# Ports are $(portBase)+offset; see k6-scripts/lib/benchmark.js SERVICES.
x-nestjs-app: &nestjs-app
  build:
    context: .
    dockerfile: apps/nestjs-app/Dockerfile
    args:
      NODE_VERSION: 26
  depends_on:
    - mock-service-node26
  networks:
    - nestjs-benchmark-node26

services:
  mock-service-node26:
    build:
      context: .
      dockerfile: apps/mock-service/Dockerfile
      args:
        NODE_VERSION: 26
    ports:
      - "3031:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
    networks:
      - nestjs-benchmark-node26

  express-axios-node26:
    <<: *nestjs-app
    ports:
      - "3032:3002"
    environment:
      - PORT=3002
      - CLIENT=axios
      - PLATFORM=express
      - MOCK_SERVICE_URL=http://mock-service-node26:3001/api/data

  express-undici-node26:
    <<: *nestjs-app
    ports:
      - "3033:3003"
    environment:
      - PORT=3003
      - CLIENT=undici
      - PLATFORM=express
      - MOCK_SERVICE_URL=http://mock-service-node26:3001/api/data

  fastify-axios-node26:
    <<: *nestjs-app
    ports:
      - "3034:3004"
    environment:
      - PORT=3004
      - CLIENT=axios
      - PLATFORM=fastify
      - MOCK_SERVICE_URL=http://mock-service-node26:3001/api/data

  fastify-undici-node26:
    <<: *nestjs-app
    ports:
      - "3035:3005"
    environment:
      - PORT=3005
      - CLIENT=undici
      - PLATFORM=fastify
      - MOCK_SERVICE_URL=http://mock-service-node26:3001/api/data

  express-axios-interceptor-node26:
    <<: *nestjs-app
    ports:
      - "3036:3006"
    environment:
      - PORT=3006
      - CLIENT=axios
      - PLATFORM=express
      - INTERCEPTOR=1
      - MOCK_SERVICE_URL=http://mock-service-node26:3001/api/data

  express-undici-interceptor-node26:
    <<: *nestjs-app
    ports:
      - "3037:3007"
    environment:
      - PORT=3007
      - CLIENT=undici
      - PLATFORM=express
      - INTERCEPTOR=1
      - MOCK_SERVICE_URL=http://mock-service-node26:3001/api/data

  undici-raw-node26:
    build:
      context: .
      dockerfile: apps/undici-raw/Dockerfile
      args:
        NODE_VERSION: 26
    ports:
      - "3038:3008"
    environment:
      - PORT=3008
      - MOCK_SERVICE_URL=http://mock-service-node26:3001/api/data
    depends_on:
      - mock-service-node26
    networks:
      - nestjs-benchmark-node26

networks:
  nestjs-benchmark-node26:
    driver: bridge
